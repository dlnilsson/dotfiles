[logging]
log_level = DEBUG

[paths]
status_file = ${XDG_RUNTIME_DIR}/hypr/screencast.status

[processes]
monitor[] = wl-screenrec
poll_interval = 2s

[notifications]
cooldown = 10s

[pin_window]
initial_delay = 500ms
max_retries = 3
retry_delay = 500ms
max_retry_delay = 2s
poll_interval = 500ms
max_poll_time = 10s

[window_matching]
starship_titles[] = Extension: (Bitwarden Password Manager) - Bitwarden — Zen Browser
starship_titles[] = Extension: (Bitwarden Password Manager) - Bitwarden — Mozilla Firefox
starship_titles[] = Extension: (Bitwarden Password Manager) - — Zen Browser
starship_titles[] = Bitwarden
starship_titles[] = Sign in – Google accounts
starship_titles[] = Sign in – Google Accounts
starship_titles[] = Sign in – Google accounts — Zen Browser
starship_titles[] = Sign in - Google Accounts — Zen Browser
starship_titles[] = Sign in - Google Accounts - Chromium
starship_titles[] = Sign in – Google accounts - Chromium
starship_titles[] = Log into Facebook — Zen Browser
starship_titles[] = Log into Facebook — Mozilla Firefox
starship_titles[] = Zed — Settings

meet_title_prefixes[] = https://meet.google.com - Meet –
meet_title_prefixes[] = Meet –

screencast_keywords[] = sharing indicator
screencast_keywords[] = sharing
screencast_keywords[] = screen
screencast_keywords[] = recording
screencast_keywords[] = capture
screencast_keywords[] = cast
screencast_keywords[] = obs
screencast_keywords[] = streamlabs
screencast_keywords[] = discord
screencast_keywords[] = zoom
screencast_keywords[] = teams
screencast_keywords[] = meet
screencast_keywords[] = chrome
screencast_keywords[] = firefox
screencast_keywords[] = browser
screencast_keywords[] = portal
screencast_keywords[] = slack
screencast_keywords[] = zen-browser

[positioning]
default_position = 74% 2%
right_padding = 2
y_position = 20
