devices: ({
    name: "MX Master 3S";

    smartshift: {
        on: true;
        threshold: 15;
        torque: 25;
    };

    hiresscroll: {
        hires: false;
        invert: false;
        target: false;
        up: {
            mode: "Axis";
            axis: "REL_WHEEL";
        },
        down: {
            mode: "Axis";
            axis: "REL_WHEEL";
        }
    };
    dpi: 800;
    thumbwheel:
    {
        divert: true;
        invert: false;
        left:
        {
            mode: "OnInterval";
            pixels: 1;
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_TAB"];
            };
        };
        right:
        {
            mode: "OnInterval";
            pixels: 1;
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_LEFTCTRL", "KEY_TAB"];
            };
        };
    };
    buttons: (
        {
            cid: 0x005b;
            action = {
                type = "keypress";
                keys = ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_TAB"];
            };
        },
        {
            cid: 0x005d;
            action = {
                type = "keypress";
                keys = ["KEY_LEFTCTRL", "KEY_TAB"];
            };
        }
    );
});
