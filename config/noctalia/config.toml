# Noctalia v5+. https://docs.noctalia.dev/noctalia/configuration/
# https://docs.noctalia.dev/noctalia/bar/

[shell]
setup_wizard_enabled = false
offline_mode          = false
telemetry_enabled     = false
popup_shadows         = true            # draw drop shadows behind popups and dropdowns

[shell.panel]
transparency_mode = "glass" #  solid | soft | glass; controls floating panel opacity and card translucency
shadow                = true   # cast the global [shell.shadow] from panel surfaces

# Privacy ignore list: cava and pw-cat microphone use, OBS screen sharing.
[shell.privacy]
mic_filter_regex = "cava|pw-cat|openwave|OpenWave|pw-loopback"
screen_filter_regex = "obs|OBS"

[shell.launcher]
categories = false
compact = true
show_icons = true
show_app_origin_indicator = false
sort_by_usage = true
show_session_button = false
show_settings_button = false
default_view = "recent"
search_position = "top"
layout = "simple"
track_usage = true

[shell.animation]
enabled = true
speed   = 1.0   # 1.0 = normal, 0.5 = 2× slower, 2.0 = 2× faster


[shell.shadow]
direction = "down_right"  # center, up, down, left, right, up_left, up_right, down_left, down_right
alpha     = 0.25    # multiplied by each component's background opacity


[location]
address = "Gothenburg, Sweden"

[theme]
mode = "dark"
source = "builtin"
builtin = "Nord"

[backdrop]
enabled        = true
blur_intensity = 0.5    # 0.0 = no blur, 1.0 = maximum blur
tint_intensity = 0.3    # 0.0 = no tint, 1.0 = fully opaque tint

[wallpaper]
enabled = true
directory = "/home/dln/Wallpapers"
fill_mode = "crop"

[wallpaper.automation]
enabled = true
interval_seconds = 3600
order = "random"
recursive = false

[notification]
enable_daemon = true
position = "top_right"
background_opacity = 1.0
scale = 1.25
width = 425

[osd]
enabled = true
follow_focused_output = true

[osd.kinds]
media = false


[brightness]
enable_ddcutil = true

[dock]
enabled = false

[plugins]
enabled = ["dln/status"]

[[plugins.source]]
name = "dotfiles"
kind = "path"
location = "~/.dotfiles/config/noctalia/plugins"
enabled = true

[bar.default]
position = "top"
layer = "top"
enabled = true
auto_hide = false
reserve_space = true
thickness = 30
margin_edge = 0
margin_ends = 0
padding = 10
widget_spacing = 5
background_opacity = 0.65
compositor_blur = true
shadow = true
radius = 1
radius_top_left = 1
radius_top_right = 1
radius_bottom_left = 1
radius_bottom_right = 1
concave_edge_corners = false
capsule = false
font_weight = 400
color = "#d8dee9"
start = ["active_window"]
center = ["clock"]
end = [
    "ef-usage",
    "spacer",
    "codex",
    "claude",
    "privacy",
    "vpn",
    "spacer",
    "glab",
    "workspaces",
    "spacer",
    "powermode",
    "tray",
    "notifications",
    "battery",
    "volume",
    "mic",
    "wlogout",
]

# 3440px ultrawides: 2506px centered, matching Hyprland 16:9 single window (1410px tall).
# Laptop and 1920px displays keep the full-width default.
[bar.default.monitor.lg]
match = "LG ULTRAGEAR"
margin_ends = 467

[bar.default.monitor.aoc]
match = "AOC CU34E4CV"
margin_ends = 467

[widget.lock_keys]
display          = "short"
show_caps_lock   = true
show_num_lock    = true
show_scroll_lock = false
hide_when_off    = false

[widget.active_window]
type = "dln/status:active-window"

[widget.audio-vis]
type       = "audio_visualizer"
width      = 64
bands      = 20
centered   = true
show_when_idle = false
color_1 = "primary"
color_2 = "secondary"

[widget.clock]
format = "{:%Y-%m-%d %H:%M}"
tooltip_format = "{:%A, %Y-%m-%d}"
anchor = true

# [widget.clock.actions]
# left = "exec gnome-calendar"

[widget.workspaces]
style = "regular"
focused_color = "#a3be8c"  # Nord green for active
occupied_color = "#81a1c1" # Nord blue for occupied

active_pill_size = 1.0
show_labels = true
focused_output_only = true
labels_only_when_occupied = false
# type = "dln/status:workspaces"

[widget.privacy]
hide_inactive = true
icon_spacing = 4
active_color = "#a3be8c"


[widget.media]
artist_first = true
art_size     = 24
hide_when_no_media = true
# hide_when_idle = true

[lockscreen]
enabled = true
lock_before_suspend = true
fingerprint = false
allow_empty_password = false
transition            = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration   = 750     # lock/unlock animation length in milliseconds
blurred_desktop = false


[lockscreen_widgets]
enabled = true

