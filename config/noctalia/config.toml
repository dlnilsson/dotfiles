[hooks]
battery_discharging = "~/.dotfiles/bin/power_saver true && notify-send --app-name=ac-notify --icon=battery-symbolic --expire-time=3000 --transient 'Power' 'Charger disconnected'"
battery_charging = "~/.dotfiles/bin/power_saver false && notify-send --app-name=ac-notify --icon=battery-good-charging-symbolic --expire-time=3000 --transient 'Power' 'Charger connected'"
battery_plugged = "~/.dotfiles/bin/power_saver false && notify-send --app-name=ac-notify --icon=battery-good-charging-symbolic --expire-time=3000 --transient 'Power' 'Charger connected'"
session_locked = [
    "bw lock >/dev/null 2>&1",
    "playerctl --all-players pause",
    "noctalia msg bar-hide",
]
session_unlocked = [
  "noctalia msg bar-show",
  "noctalia msg dpms-on",
]



[idle]
behavior_order = ["lock", "screen-off", "suspend"]
pre_action_fade_seconds = 0

# The helper preserves the LG/tardis exception and retries it every 30 seconds.
[idle.behavior.lock]
enabled = true
timeout = 300
action = "command"
command = "~/.dotfiles/bin/noctalia-idle lock idle"
resume_command = "~/.dotfiles/bin/noctalia-idle lock resume"

[idle.behavior.screen-off]
enabled = true
timeout = 1800
action = "command"
command = "~/.dotfiles/bin/noctalia-idle screen-off idle"
resume_command = "~/.dotfiles/bin/noctalia-idle screen-off resume"

[idle.behavior.suspend]
enabled = true
timeout = 10800
action = "command"
command = "~/.dotfiles/bin/noctalia-idle suspend idle"
resume_command = "~/.dotfiles/bin/noctalia-idle suspend resume"

[battery]
warning_threshold = 30

[widget.battery]
display_mode = "glyph"
show_label = true
label_content = "percent"
warning_color = "#bf616a"

[widget.volume]
device = "output"
show_label = true

[widget.volume.actions]
left = "exec pavucontrol"
scroll_up = "volume-up 1%"
scroll_down = "volume-down 1%"

[widget.tray]
drawer = false
hide_passive = false
# Noctalia probes both /StatusNotifierItem and /org/ayatana/NotificationItem for
# each tray app. dygmate-tray answers on every path, so it would appear twice.
# Hiding the bare Ayatana path drops the copy; /org/ayatana/NotificationItem/<app>
# items such as caffeine use a longer path and stay visible.
hidden = ["/org/ayatana/NotificationItem"]

# Status scripts share one polling service across monitors.
[widget.ef-usage]
type = "dln/status:ef-usage"
color = "#81a1c1"

[shell.launcher.dmenu.entry.commands]
command = "printf 'Excursion funnel'"
label = "Commands"
glyph = "terminal"
global = false
exec = "kitty --class ef-usage -o background_opacity=1.0 -e sh -c \"ef usage today; ef usage today --heatmap; read\""

[widget.ef-usage.actions]
left = "exec kitty --class ef-usage -o background_opacity=1.0 -e sh -c 'ef usage today; ef usage today --heatmap; read'"

[widget.codex]
type = "dln/status:codex"

[widget.claude]
type = "dln/status:claude"

[widget.vpn]
type = "dln/status:vpn"

[widget.glab]
type = "dln/status:glab"

[widget.powermode]
type = "dln/status:powermode"

[widget.wlogout]
type = "custom_button"
glyph = "power"
tooltip = "Session menu"

[widget.wlogout.actions]
left = "exec wlogout --protocol layer-shell"

[widget.mic]
type = "volume"
device = "input"
show_label = false # icon only; set to true to also show the mic level
mute_color = "#bf616a"    # Nord red, same as battery warning_color
