# Noctalia v5+. https://docs.noctalia.dev/noctalia/configuration/
# https://docs.noctalia.dev/noctalia/bar/

[shell]
setup_wizard_enabled = false

# Privacy ignore list: cava and pw-cat microphone use, OBS screen sharing.
[shell.privacy]
mic_filter_regex = "cava|pw-cat"
screen_filter_regex = "obs|OBS"

[shell.launcher]
categories = false
compact = true
show_icons = true
show_app_origin_indicator = false

[location]
address = "Gothenburg, Sweden"

[theme]
mode = "dark"
source = "builtin"
builtin = "Nord"

[backdrop]
enabled        = true
blur_intensity = 0.5    # 0.0 = no blur, 1.0 = maximum blur
tint_intensity = 0.3    # 0.0 = no tint, 1.0 = fully opaque tint

[wallpaper]
enabled = true
directory = "/home/dln/Wallpapers"
fill_mode = "crop"

[wallpaper.automation]
enabled = true
interval_seconds = 3600
order = "random"
recursive = false

[notification]
enable_daemon = false

[osd]
enabled = false

[dock]
enabled = false

[plugins]
enabled = ["dln/status"]

[[plugins.source]]
name = "dotfiles"
kind = "path"
location = "~/.dotfiles/config/noctalia/plugins"
enabled = true

[bar.default]
position = "top"
layer = "top"
enabled = true
auto_hide = false
reserve_space = true
thickness = 30
margin_edge = 0
margin_ends = 0
padding = 10
widget_spacing = 5
background_opacity = 1.0
compositor_blur = false
shadow = false
radius = 1
radius_top_left = 1
radius_top_right = 1
radius_bottom_left = 1
radius_bottom_right = 1
concave_edge_corners = false
capsule = false
font_weight = 400
color = "#d8dee9"
start = ["active_window"]
center = ["clock"]
end = [
    "ef-usage",
    "codex",
    "claude",
    "recording",
    "privacy",
    "vpn",
    "glab",
    "workspaces",
    "powermode",
    "tray",
    "swaync",
    "battery",
    "volume",
    "wlogout",
]

# 3440px ultrawides: 2506px centered, matching Hyprland 16:9 single window (1410px tall).
# Laptop and 1920px displays keep the full-width default.
[bar.default.monitor.lg]
match = "LG ULTRAGEAR"
margin_ends = 467

[bar.default.monitor.aoc]
match = "AOC CU34E4CV"
margin_ends = 467

[widget.active_window]
type = "dln/status:active-window"

[widget.clock]
format = "{:%Y-%m-%d %H:%M}"
tooltip_format = "{:%A, %Y-%m-%d}"
anchor = true

[widget.clock.actions]
left = "exec gnome-calendar"

[widget.workspaces]
type = "dln/status:workspaces"

[widget.privacy]
hide_inactive = true
icon_spacing = 4
active_color = "#a3be8c"

[lockscreen]
enabled = true
lock_before_suspend = true
fingerprint = false
allow_empty_password = false

[lockscreen_widgets]
enabled = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
type = "login_box"
output = "DP-1"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
show_session_buttons = false
show_weather = false

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
type = "login_box"
output = "DP-2"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
show_session_buttons = false
show_weather = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
show_session_buttons = false
show_weather = false

[lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
type = "login_box"
output = "FALLBACK"

[lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
show_session_buttons = false
show_weather = false

[lockscreen_widgets.widget."lockscreen-clock@DP-1"]
type = "clock"
output = "DP-1"
cx = 1720.0
cy = 160.0
box_width = 420.0
box_height = 120.0
placement_width = 3440.0
placement_height = 1440.0

[lockscreen_widgets.widget."lockscreen-clock@DP-1".settings]
format = "{:%H:%M}"
center_text = true
background = false
shadow = true

[lockscreen_widgets.widget."lockscreen-clock@DP-2"]
type = "clock"
output = "DP-2"
cx = 1720.0
cy = 160.0
box_width = 420.0
box_height = 120.0
placement_width = 3440.0
placement_height = 1440.0

[lockscreen_widgets.widget."lockscreen-clock@DP-2".settings]
format = "{:%H:%M}"
center_text = true
background = false
shadow = true

[lockscreen_widgets.widget."lockscreen-clock@eDP-1"]
type = "clock"
output = "eDP-1"
cx = 960.0
cy = 160.0
box_width = 420.0
box_height = 120.0
placement_width = 1920.0
placement_height = 1200.0

[lockscreen_widgets.widget."lockscreen-clock@eDP-1".settings]
format = "{:%H:%M}"
center_text = true
background = false
shadow = true

[lockscreen_widgets.widget."lockscreen-clock@FALLBACK"]
type = "clock"
output = "FALLBACK"
cx = 960.0
cy = 160.0
box_width = 420.0
box_height = 120.0
placement_width = 1920.0
placement_height = 1080.0

[lockscreen_widgets.widget."lockscreen-clock@FALLBACK".settings]
format = "{:%H:%M}"
center_text = true
background = false
shadow = true

[hooks]
session_locked = "bw lock >/dev/null 2>&1"

[idle]
behavior_order = ["lock", "screen-off", "suspend"]
pre_action_fade_seconds = 0

# The helper preserves the LG/tardis exception and retries it every 30 seconds.
[idle.behavior.lock]
enabled = true
timeout = 300
action = "command"
command = "~/.dotfiles/bin/noctalia-idle lock idle"
resume_command = "~/.dotfiles/bin/noctalia-idle lock resume"

[idle.behavior.screen-off]
enabled = true
timeout = 1800
action = "command"
command = "~/.dotfiles/bin/noctalia-idle screen-off idle"
resume_command = "~/.dotfiles/bin/noctalia-idle screen-off resume"

[idle.behavior.suspend]
enabled = true
timeout = 10800
action = "command"
command = "~/.dotfiles/bin/noctalia-idle suspend idle"
resume_command = "~/.dotfiles/bin/noctalia-idle suspend resume"

[battery]
warning_threshold = 30

[widget.battery]
display_mode = "glyph"
show_label = true
label_content = "percent"
warning_color = "#bf616a"

[widget.volume]
device = "output"
show_label = true

[widget.volume.actions]
left = "exec pavucontrol"
scroll_up = "volume-up 1%"
scroll_down = "volume-down 1%"

[widget.tray]
drawer = false
hide_passive = false
# Noctalia probes both /StatusNotifierItem and /org/ayatana/NotificationItem for
# each tray app. dygmate-tray answers on every path, so it would appear twice.
# Hiding the bare Ayatana path drops the copy; /org/ayatana/NotificationItem/<app>
# items such as caffeine use a longer path and stay visible.
hidden = ["/org/ayatana/NotificationItem"]

# Status scripts share one polling service across monitors.
[widget.ef-usage]
type = "dln/status:ef-usage"
color = "#81a1c1"

[widget.ef-usage.actions]
left = "exec kitty --class ef-usage -o background_opacity=1.0 -e sh -c 'ef usage today; ef usage today --heatmap; read'"

[widget.codex]
type = "dln/status:codex"

[widget.claude]
type = "dln/status:claude"

[widget.vpn]
type = "dln/status:vpn"

[widget.recording]
type = "dln/status:recording"

[widget.glab]
type = "dln/status:glab"

[widget.powermode]
type = "dln/status:powermode"

[widget.swaync]
type = "custom_button"
glyph = "bell"
tooltip = "Notifications. Right-click toggles Do Not Disturb."

[widget.swaync.actions]
left = "exec swaync-client -t -sw"
right = "exec swaync-client -d -sw"

[widget.wlogout]
type = "custom_button"
glyph = "power"
tooltip = "Session menu"

[widget.wlogout.actions]
left = "exec wlogout --protocol layer-shell"
