# Regex rules. The first matching rule wins; $1 keeps capture group 1.
[rewrite]
# Site rules: browser tab titles. They must stay before the browser suffix rules.
'(.*) - YouTube — Zen Browser' = '󰗃  $1' # md-youtube
'YouTube — Zen Browser' = '󰗃  YouTube' # md-youtube
'(.*) · GitHub — Zen Browser' = '󰊤  $1' # md-github
'GitHub — Zen Browser' = '󰊤  GitHub' # md-github
'(.*) · GitLab — Zen Browser' = '󰮠  $1' # md-gitlab
'(.*) - Gmail — Zen Browser' = '󰊫  $1' # md-gmail
'Google Calendar - (.*) — Zen Browser' = '󰃭  $1' # md-calendar
'(.*) - Google Drive — Zen Browser' = '󰊶  $1' # md-google_drive
'(.*) - Google Maps — Zen Browser' = '󰗵  $1' # md-google_maps
'Google Maps — Zen Browser' = '󰗵  Google Maps' # md-google_maps
'(.*) - Google Translate — Zen Browser' = '󰊿  $1' # md-google_translate
'Google Translate — Zen Browser' = '󰊿  Google Translate' # md-google_translate
'(.*) : r/.* — Zen Browser' = '󰑍  $1' # md-reddit
'Reddit - (.*) — Zen Browser' = '󰑍  $1' # md-reddit
'(.*) - Twitch — Zen Browser' = '󰕃  $1' # md-twitch
'Twitch — Zen Browser' = '󰕃  Twitch' # md-twitch
'(.*) - Jira — Zen Browser' = '󰌃  $1' # md-jira
'(.*) - Confluence — Zen Browser' = '  $1' # dev-confluence
'(.*) [—|-] Sentry — Zen Browser' = '  $1' # dev-sentry
'(.*) - Stack Overflow — Zen Browser' = '󰓌  $1' # md-stack_overflow
'(.*) - Wikipedia — Zen Browser' = '󰖬  $1' # md-wikipedia
'(.*) \| LinkedIn — Zen Browser' = '󰌻  $1' # md-linkedin
'LinkedIn — Zen Browser' = '󰌻  LinkedIn' # md-linkedin
'Netflix — Zen Browser' = '󰝆  Netflix' # md-netflix
'(.*) - Outlook — Zen Browser' = '󰴢  $1' # md-microsoft_outlook
'(.*) \| Spotify — Zen Browser' = '󰓇  $1' # md-spotify
'Spotify – Web Player — Zen Browser' = '󰓇  Spotify – Web Player' # md-spotify
'(.*) \| Hacker News — Zen Browser' = '  $1' # fa-hacker_news
'Hacker News — Zen Browser' = '  Hacker News' # fa-hacker_news
'(.*) - Claude — Zen Browser' = '  $1' # cod-claude
'Claude — Zen Browser' = '  Claude' # cod-claude
'ChatGPT — Zen Browser' = '  ChatGPT' # cod-openai
'(.*) — Zen Browser' = '$1'
'(.*) — Code - OSS' = '$1'
'(.*) - Visual Studio Code' = '$1'
'(.*) - Slack.*' = ' $1'
'(.*) - Discord' = '   $1'
'(.*) - Cursor' = '$1'
'(.*) - Chromium' = '$1'
'(.*) - Free Version' = '$1'
'^Claude (.*)' = ' $1' # cod-claude

