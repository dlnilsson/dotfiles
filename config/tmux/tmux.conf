# Nord theme
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#3b4252]"
set -g status-right "#[fg=#4c566a,bg=#3b4252]#[fg=#d8dee9,bg=#4c566a] %Y-%m-%d  %H:%M #[fg=#88c0d0,bg=#4c566a]#[fg=#2e3440,bg=#88c0d0,bold] #H "

set -g window-status-format "#[fg=#d8dee9,bg=#3b4252] #I:#W "
set -g window-status-current-format "#[fg=#2e3440,bg=#81a1c1,bold] #I:#W #[fg=#81a1c1,bg=#3b4252]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#ebcb8b,bg=#3b4252,bold"
set -g window-status-bell-style "fg=#bf616a,bg=#3b4252,bold"

set -g message-style "bg=#5e81ac,fg=#eceff4,bold"
set -g mode-style "bg=#a3be8c,fg=#2e3440,bold"
