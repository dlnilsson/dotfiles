plugin {
  hyprwinwrap {
	class = kitty-bg
  	title = kitty-bg
  }
  hyprexpo {
      columns = 3
      gap_size = 5
      bg_col = rgba(3b42522a)
      workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1
      skip_empty = true
      # gesture_distance = 900 # how far is the "max" for the gesture
  }
}

group {
	col.border_active = rgba(33ccffee)  # Active group border color
	col.border_inactive = rgba(222222aa)
	groupbar {
		enabled = true
		render_titles = true
		height = 25
		text_color = rgba(ffffffee)
		font_size = 12
		font_family = monospace
		font_weight_active = ultraheavy
		font_weight_inactive = normal
		indicator_height = 0
		indicator_gap = 5
		height = 22
		gaps_in = 5
		gaps_out = 0
		gradients = true
		gradient_rounding = 0
		gradient_round_only_edges = false
	}
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.05
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    # blur {
    #     enabled = true
    #     size = 3
    #     passes = 1

    #     vibrancy = 0.1696
    # }
    blur {
        enabled = true
        size = 1
        noise = 0.0  # 0.0117
        vibrancy = 0.1696  #0.1696
        vibrancy_darkness = 0.3
        passes = 2
        new_optimizations = yes
        ignore_opacity = false
        ignore_opacity=true
    }

}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = md3_accel, 0.05, 0.7, 0.1, 1
	bezier = easeInOutElasticApprox,0.68,-0.55,0.27,1.55

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 1.79, easeOutQuint
#    animation = windowsIn, 1, 4.5, easeOutQuint, popin 87%
#    animation = windowsOut, 1, 2, easeInOutCubic, popin 87%
    animation = windowsIn, 1, 1.5, easeOutQuint, gnomed
    animation = windowsOut, 1, 1.5, easeInOutCubic, gnomed
    animation = fadeIn, 1, 0.73, almostLinear
    animation = fadeOut, 1, 0.46, almostLinear
    animation = fade, 1, 0.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor, 1, 7, quick
    #animation = hyprfocusIn, 1, 1.7, md3_accel
    #animation = hyprfocusOut, 1, 1.7, md3_accel
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"


workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0


windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = border_size 0, match:float 0, match:workspace f[1]s[false]
windowrule = rounding 0, match:float 0, match:workspace f[1]s[false]


windowrule {
  name = pip
  match:title = ^(Picture in Picture|Picture-in-Picture)$

  float = on
  opacity = 1.0 1.0
  no_blur = on
  border_size = 0
  no_dim = on
  no_anim = on
  no_shadow = on
  rounding = 0
  pin = on
}

windowrule {
  name = system-utils-float
  match:class = ^(org.twosheds.iwgtk|blueman-manager|com.saivert.pwvucontrol|org.pulseaudio.pavucontrol|iwgtk)$

  float = on
}

windowrule {
  name = tag-browser
  match:class = ^(zen|chromium|Chromium|firefox|Opera|vivaldi-stable)$

  tag = browser
}

windowrule {
	name = terminal
    match:class = (Alacritty|kitty|com.mitchellh.ghostty)

    tag = terminal	
}

windowrule {
  name = starship
  match:tag = ^(starship)$

  float = on
  center = on
  no_screen_share = on
  size = 1024 768
}


windowrule {
  name = copyq
  match:class = ^(copyq)$

  float = on
  center = on
  no_blur = on
  no_dim = on
  no_screen_share = on
  dim_around = on
  suppress_event = fullscreen
  opacity = 0.95 0.95
  animation = popin 85%
  rounding = 10
  border_size = 0
  stay_focused = on
}

windowrule {
    name = zed
    match:class = ^(dev\.zed\.Zed)$

    opacity = 0.98 0.98
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    smart_split = true
	permanent_direction_override = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

scrolling {
	fullscreen_on_one_column = true
	column_width = 0.9
	direction = right
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    focus_on_activate = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

binds {
    # default scroll_event_delay 300
    scroll_event_delay = 50
}

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = se
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = omkbd-ergodash-rev1.2
    kb_layout = eu
}
device {
    name = dygma-defy-keyboard
    kb_layout = eu
}
device {
    name = dygma-defy-keyboard-1
    kb_layout = eu
}



# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

#bind = $mainMod, z, easymotion, action:hyprctl dispatch focuswindow address:{}


bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod SHIFT, period, layoutmsg, swapcol r
bind = $mainMod SHIFT, comma, layoutmsg, swapcol l




# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
#bind = $mainMod, Q, killactive,
bind = SUPER_SHIFT, Q, killactive,

# Kitty quick-access terminal on Meta+Esc
bind = $mainMod, TAB, exec, kitten quick-access-terminal

# bind = $mainMod, M, exit,
# bind = $mainMod, E, exec, layoutmsg, orientationnext
# bind = $mainMod, V, togglefloating,
# bind = $mainMod, V, pass, class:^(copyq)$
# Binds: first, “eat” the keys when CopyQ is focused
bind = $mainMod, V, pass, class:^(copyq)$
bind = $mainMod, F, pass, class:^(copyq)$

# Then, normal behavior for everyone else (negative match)
bind = $mainMod, B, togglefloating, class:negative:^(copyq)$
bind = $mainMod, F, fullscreen,      class:negative:^(copyq)$

bind = ALT, TAB, focusurgentorlast

bind = $mainMod, K, exec, swayosd-client --custom-message="$(date '+%H:%M %A')"
bind = $mainMod, T, exec, sleep 0.1 && swaync-client -t -sw
#bind = $mainMod, T, exec, swayosd-client --custom-message="$(date +%H:%M)"

bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
 bind = $mainMod, E, togglesplit, # dwindle
#bind = $mainMod, E, hy3:makegroup, # hy3

bind = $mainMod, R, exec, /home/dln/go/bin/hyprtabs
# bind = $mainMod, F, fullscreen
# bind = $mainMod, F, pass, class:^(copyq)$

bind = $mainMod, L, exec, /home/dln/.dotfiles/bin/lock
bind = $mainMod, O, exec, /home/dln/.dotfiles/bin/wofi-ykman
#bind = SUPER_SHIFT, V, exec, /home/dln/.dotfiles/bin/wofi-copyq
# bind = SUPER_SHIFT, V, exec, cliphist list | wofi -dmenu | cliphist decode | wl-copy
#bind = SUPER_SHIFT, V, exec, /home/dln/.dotfiles/bin/rofi-copyq
bind = SUPER_SHIFT, V, exec, QT_QPA_PLATFORM=xcb copyq show
# bind = , Print, exec, grim -g "$(slurp)"
# bind = , Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy --type image/png'
# bind = , Print, exec, sh -c 'flameshot gui -r | wl-copy --type image/png'
bind = , Print, exec, sh -c 'flameshot gui --clipboard'
bind = $mainMod, Y, pin   # pin/unpin active window
# Clamshell mode configuration

## Lid is opened
bindl=,switch:off:Lid Switch,exec,/home/dln/.dotfiles/bin/clamshell open

## Lid is closed
bindl=,switch:on:Lid Switch,exec,/home/dln/.dotfiles/bin/clamshell close

$mf = movefocus # dwindle
$mw = movewindow # dwindle
# $mf = hy3:movefocus
# $mw = hy3:movewindow

# Move focus with mainMod + arrow keys
bind = $mainMod, left, $mf, l
bind = $mainMod, right, $mf, r
bind = $mainMod, up, $mf, u
bind = $mainMod, down, $mf, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = SUPER_CTRL, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 1.1)')
# Zoom out with mod+shift + scroll down (minimum 1)
bind = SUPER_CTRL, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
bind = $mainMod, HOME , exec,  hyprctl -q keyword cursor:zoom_factor 1
binde = $mainMod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
# Move/resize windows with mainMod + LMB/RMB and dragging

bindm = $mainMod, mouse:272, $mw
bindm = $mainMod, mouse:273, resizewindow

# Only display the OSD on the currently focused monitor
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, $osdclient --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, $osdclient --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, $osdclient --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, $osdclient --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, $osdclient --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, $osdclient --brightness lower

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $osdclient --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $osdclient --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, $osdclient --brightness +1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, $osdclient --brightness -1

# Requires playerctl
bindld = , XF86AudioNext, Next track, exec, $osdclient --playerctl next
bindld = , XF86AudioPause, Pause, exec, $osdclient --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, $osdclient --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, $osdclient --playerctl previous



