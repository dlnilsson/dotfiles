#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Toolkit Backend Variables
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland
env = GTK_THEME,Nord
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Nordic"   # for GTK3 apps
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

###################
### PERMISSIONS ###
###################
ecosystem {
   enforce_permissions = 1
}
# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons
permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, ask
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
permission = /usr/(bin|local/bin)/hyprlock, screencopy, allow
permission = /usr/bin/swaylock, screencopy, allow
permission = /usr/bin/hyprlock, screencopy, allow


# --- Allow keyboards you already have connected (exact name regexes) ---
permission = ^omkbd-ergodash-rev1\.2$, keyboard, allow
permission = ^omkbd-ergodash-rev1\.2-(consumer-control|system-control)$, keyboard, allow
permission = ^dygma-defy-keyboard-1$, keyboard, allow
permission = ^dygma-defy-keyboard$, keyboard, allow
permission = ^dygma-defy-mouse$, keyboard, allow

# Built-in + current extras you listed
permission = ^at-translated-set-2-keyboard$, keyboard, allow
permission = ^thinkpad-extra-buttons$, keyboard, allow
permission = ^logitech-usb-receiver(-consumer-control|-system-control)?$, keyboard, allow
permission = ^keyd-virtual-keyboard$, keyboard, allow
permission = ^logiops-virtual-input$, keyboard, allow
permission = ^(video-bus|power-button|sleep-button|dp-1|dp-2)$, keyboard, allow


# --- Anything else (not currently plugged in) will prompt ---
permission = .*, keyboard, ask


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)
    col.active_border = rgba(88c0d0ee) rgba(8fbcbbee) 30deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
    #layout = master
}
group {
    col.border_active = rgba(33ccffee)  # Active group border color
    col.border_inactive = rgba(222222aa)
    groupbar {
        enabled = true
        render_titles = true
        height = 25
        font_size = 14
        text_color = rgba(ffffffee)
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.05
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    # blur {
    #     enabled = true
    #     size = 3
    #     passes = 1

    #     vibrancy = 0.1696
    # }
    blur {
        enabled = true
        size = 1
        noise = 0.0  # 0.0117
        vibrancy = 0.1696  #0.1696
        vibrancy_darkness = 0.3
        passes = 2
        new_optimizations = yes
        ignore_opacity = false
        ignore_opacity=true
    }

}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 1.79, easeOutQuint
    animation = windowsIn, 1, 4.5, easeOutQuint, popin 87%
    animation = windowsOut, 1, 2, easeInOutCubic, popin 87%
    animation = fadeIn, 1, 0.73, almostLinear
    animation = fadeOut, 1, 0.46, almostLinear
    animation = fade, 1, 0.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor, 1, 7, quick
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]s[false]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]s[false]
windowrule = bordersize 0, floating:0, onworkspace:f[1]s[false]
windowrule = rounding 0, floating:0, onworkspace:f[1]s[false]

windowrule = float,title:^Picture-in-Picture$
windowrulev2 = noblur,class:^()$,title:^()$
windowrulev2 = tag +browser, class:(zen)
windowrulev2 = float, class:^(zen)$, tag:^(?!browser$).*
windowrulev2 = float, title:'Extension: \(Bitwarden Password Manager\) - Bitwarden — Zen Browser'
# hyprctl dispatch togglefloating title:'Extension: \(Bitwarden Password Manager\) - Bitwarden — Zen Browser'
windowrulev2 = float, class:^(org.twosheds.iwgtk)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(com.saivert.pwvucontrol)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(iwgtk)$


windowrulev2 = float, class:^(copyq)$
windowrulev2 = suppressevent fullscreen, class:^(copyq)$
windowrulev2 = opacity 0.95 0.95, class:^(copyq)$
windowrulev2 = animation popin 85%, class:^(copyq)$
windowrulev2 = rounding 10, class:^(copyq)$
windowrulev2 = noborder, class:^(copyq)$
windowrule = noblur, class:^(copyq)$
windowrule = nodim, class:^(copyq)$
windowrule = noscreenshare, class:^(copyq)$
windowrule = dimaround, class:^(copyq)$

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    focus_on_activate = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

binds {
    # default scroll_event_delay 300
    scroll_event_delay = 50
}
#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = se
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = omkbd-ergodash-rev1.2
    kb_layout = eu
}
device {
    name = dygma-defy-keyboard
    kb_layout = eu
}
device {
    name = dygma-defy-keyboard-1
    kb_layout = eu
}


