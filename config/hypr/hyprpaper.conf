# .. more monitors
#enable splash text rendering over the wallpaper
splash = false
splash_offset = 0
splash_opacity = 0
ipc = on

wallpaper {
    monitor =
    path = /home/dln/Wallpapers/
    # path = /home/dln/Wallpapers/spider-man
    fit_mode = cover
    timeout = 3600
}
